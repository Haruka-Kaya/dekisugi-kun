<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デキすぎ君 調査</title>
<style>
:root{--bg:#F2F3F5;--card:#fff;--line:#DCDFE5;--ink:#1A1F27;--muted:#5D6675;--accent:#2F5FA8}
@media(prefers-color-scheme:dark){:root{--bg:#12161D;--card:#1A2029;--line:#2C3541;--ink:#E6EAF0;--muted:#98A2B2;--accent:#86A9E4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
font-size:16px;line-height:1.8;padding:0 16px 48px}
.wrap{max-width:560px;margin:0 auto}h1{font-size:21px;margin:32px 0 6px;font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;
padding:18px 16px;margin-bottom:14px;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--accent)}
a.card b{display:block;font-size:17px;margin-bottom:4px;color:var(--accent)}
a.card span{font-size:14px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.8;margin-top:28px}
</style></head><body><div class="wrap">
<h1>ご協力ありがとうございます</h1>
<p class="sub">どちらも数分で終わります。両方やってもらえると助かります。</p>
<a class="card" href="/survey/rika/"><b>理科の考え方 調査</b><span>中学理科「力と運動」について。10分ほど</span></a>
<a class="card" href="/survey/type/"><b>文字の読みやすさ調査</b><span>2つの文章を見くらべて選ぶだけ。3分ほど</span></a>
<p class="note">集めるのは学年などの選択と、あなたが書いた答えだけです。
名前・メールアドレスなど、あなたが誰かが分かる情報は取りません。</p>
</div></body></html>
