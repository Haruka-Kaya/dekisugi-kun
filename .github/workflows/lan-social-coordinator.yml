name: LAN social coordinator artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lan-social-coordinator.yml'
      - 'server/coordinator-launchers/**'
      - 'server/lib/day.ts'
      - 'server/lib/lan-social*.ts'
      - 'server/scripts/build-lan-social-binary.mjs'
      - 'server/scripts/lan-social-server.ts'
      - 'server/scripts/smoke-lan-social-binary.mjs'
      - 'server/scripts/verify-lan-social-binary-reproducible.mjs'
      - 'server/test/lan_social*.test.ts'
      - 'server/package.json'
      - 'server/package-lock.json'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/lan-social-coordinator.yml'
      - 'server/coordinator-launchers/**'
      - 'server/lib/day.ts'
      - 'server/lib/lan-social*.ts'
      - 'server/scripts/build-lan-social-binary.mjs'
      - 'server/scripts/lan-social-server.ts'
      - 'server/scripts/smoke-lan-social-binary.mjs'
      - 'server/scripts/verify-lan-social-binary-reproducible.mjs'
      - 'server/test/lan_social*.test.ts'
      - 'server/package.json'
      - 'server/package-lock.json'

permissions:
  contents: read

concurrency:
  group: lan-social-coordinator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            artifact: macos-arm64
          - runner: windows-2025
            artifact: windows-x64
          - runner: ubuntu-24.04
            artifact: linux-x64

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:social:lan
      - run: npm run social:binary
      - run: npm run social:binary:reproducible
      - run: npm run social:binary:smoke

      - name: Verify clean checkout stayed clean
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - uses: actions/upload-artifact@v4
        with:
          name: dekisugi-lan-coordinator-${{ matrix.artifact }}
          path: |
            server/dist/dekisugi-lan-coordinator-*.tar.gz
            server/dist/dekisugi-lan-coordinator-*.tar.gz.sha256
            server/dist/dekisugi-lan-coordinator-*.zip
            server/dist/dekisugi-lan-coordinator-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
