name: Server CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/server.yml'
      - 'server/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/server.yml'
      - 'server/**'

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies from lockfile
        working-directory: server
        run: npm ci

      - name: Typecheck and test
        working-directory: server
        run: npm test

      - name: Check public survey state script
        working-directory: server
        run: node --check public/survey/state.js

      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Verify checkout stayed clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
