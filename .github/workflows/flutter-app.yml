name: Flutter app clean checkout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/flutter-app.yml'
      - 'app/**'
      - 'server/**'
      - 'tools/make-icon.py'
      - 'tools/requirements-icons.txt'
      - 'tools/test_make_icon.py'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/flutter-app.yml'
      - 'app/**'
      - 'server/**'
      - 'tools/make-icon.py'
      - 'tools/requirements-icons.txt'
      - 'tools/test_make_icon.py'

permissions:
  contents: read

concurrency:
  group: flutter-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: server, Flutter, Android debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-icons.txt

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Test and typecheck server
        working-directory: server
        run: npm test

      - name: Verify bundled catalog is generated from schema v10 source
        working-directory: server
        run: npm run catalog:check

      - name: Verify native brand assets are reproducible
        run: |
          python3 -m pip install --requirement tools/requirements-icons.txt
          python3 tools/test_make_icon.py
          python3 tools/make-icon.py --check

      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Test
        working-directory: app
        run: flutter test --no-pub --exclude-tags macos-golden

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub

      - name: Verify clean checkout stayed clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  ios:
    name: iOS Simulator debug
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: app/ios

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Install iOS pods from lockfile
        working-directory: app/ios
        run: bundle exec pod install --deployment

      # Noto Sans JP golden baselines are authored on macOS. Comparing them on
      # Linux changes glyph rasterization; enforce the same strict comparison
      # on their canonical platform instead of widening the tolerance.
      - name: Verify macOS visual baselines
        working-directory: app
        run: flutter test --no-pub --tags macos-golden

      - name: Save visual differences for review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-visual-differences
          path: app/test/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build iOS Simulator app
        working-directory: app
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/app/ios/Gemfile
        run: bundle exec flutter build ios --simulator --debug --no-pub

      - name: Verify clean checkout stayed clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
