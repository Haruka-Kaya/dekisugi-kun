name: Flutter app clean checkout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/flutter-app.yml'
      - 'app/**'
      - 'server/**'
  push:
    branches:
      - dev
      - main
    paths:
      - '.github/workflows/flutter-app.yml'
      - 'app/**'
      - 'server/**'

permissions:
  contents: read

concurrency:
  group: flutter-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: server, Flutter, Android debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Test and typecheck server
        working-directory: server
        run: npm test

      - name: Verify bundled catalog is generated from schema v9 source
        working-directory: server
        run: npm run catalog:check

      - name: Audit production server dependencies
        working-directory: server
        run: npm audit --omit=dev

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Test
        working-directory: app
        run: flutter test --no-pub

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub

      - name: Verify clean checkout stayed clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  ios:
    name: iOS Simulator debug
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true
          working-directory: app/ios

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Install iOS pods from lockfile
        working-directory: app/ios
        run: bundle exec pod install --deployment

      - name: Build iOS Simulator app
        working-directory: app
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/app/ios/Gemfile
        run: bundle exec flutter build ios --simulator --debug --no-pub

      - name: Verify clean checkout stayed clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
