name: QR participation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/qr-participation.yml'
      - 'app/**'
  push:
    paths:
      - '.github/workflows/qr-participation.yml'
      - 'app/**'

permissions:
  contents: read

concurrency:
  group: qr-participation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: QR flows and Android build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze QR paths
        working-directory: app
        run: >-
          flutter analyze --no-pub
          lib/screens/qr_scan_screen.dart
          lib/widgets/participant_qr_code.dart
          lib/screens/lan_social_screen.dart
          lib/screens/local_classroom_screen.dart
          test/qr_scan_screen_test.dart
          test/lan_social_screen_test.dart
          test/local_classroom_screen_test.dart

      - name: Test QR paths
        working-directory: app
        run: >-
          flutter test --no-pub
          test/qr_scan_screen_test.dart
          test/lan_social_screen_test.dart
          test/local_classroom_run_store_test.dart
          test/local_classroom_screen_test.dart

      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub

      - name: Verify clean checkout stayed clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
